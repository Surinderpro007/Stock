  <g transform="translate(35, 14)">
    <!-- Outer orange curve -->
    <path d="M 40,8 C 50,18 52,32 44,44 C 36,54 20,54 10,44 C 4,36 4,26 8,18 C 12,24 16,30 22,32 C 30,34 38,30 40,22 C 40,16 36,12 30,10 C 34,8 38,8 40,8 Z" fill="#F58220"/>
