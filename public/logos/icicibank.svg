    <path d="M 22,22 C 26,20 30,22 30,26 L 24,46 C 22,50 18,50 14,46 C 12,42 14,38 16,34 L 20,24 Z" fill="#B82228"/>
  </g>
  <!-- ICICI Bank Wordmark -->
  <text x="60" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#B82228" letter-spacing="1">ICICI</text>
  <text x="60" y="103" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#F58220" letter-spacing="1.5">BANK</text>
