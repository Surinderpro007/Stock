<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="16" fill="#FFFFFF"/>
  <g transform="translate(15, 16)">
    <!-- TCS Modern Geometric Facet Mark -->
    <!-- Pink / Magenta triangle -->
    <polygon points="45,6 64,18 45,30" fill="#E6007E"/>
    <!-- Purple facet -->
    <polygon points="45,30 64,18 64,42" fill="#802882"/>
    <!-- Blue facet -->
    <polygon points="45,30 64,42 45,54" fill="#005BA6"/>
    <!-- Cyan facet -->
    <polygon points="45,54 26,42 45,30" fill="#00A3E0"/>
    <!-- Green/Teal facet -->
    <polygon points="26,42 26,18 45,30" fill="#009A66"/>
    <!-- Yellow facet -->
    <polygon points="26,18 45,6 45,30" fill="#FFC20E"/>
  </g>
  <!-- TATA Wordmark -->
  <text x="60" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#005696" letter-spacing="3">TATA</text>
  <!-- TCS Wordmark -->
  <text x="60" y="103" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="900" fill="#1B1C1D" letter-spacing="1">TCS</text>
</svg>
