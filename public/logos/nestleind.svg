<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="16" fill="#FFFFFF"/>
  <!-- Nestle Blue Oak Branch & Nest -->
  <g transform="translate(32, 16)">
    <!-- Branch -->
    <path d="M 0,38 C 14,34 32,38 56,36 C 44,42 20,42 0,38 Z" fill="#7A6855"/>
    <!-- Nest bowl -->
    <path d="M 12,32 C 16,44 40,44 44,32 C 34,36 22,36 12,32 Z" fill="#8C7853"/>
    <!-- Mother bird -->
    <path d="M 16,28 C 12,22 16,14 24,14 C 28,14 30,18 32,24 C 28,26 22,28 16,28 Z" fill="#005CA9"/>
    <circle cx="20" cy="18" r="1.5" fill="#FFFFFF"/>
    <!-- Two Little chicks -->
    <path d="M 32,28 C 30,24 32,20 36,20 C 38,20 40,24 38,28 Z" fill="#005CA9"/>
    <path d="M 38,28 C 36,24 38,22 42,22 C 44,22 44,26 42,28 Z" fill="#005CA9"/>
  </g>
  <!-- Wordmark -->
  <text x="60" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#005CA9" letter-spacing="-0.5">Nestlé</text>
  <text x="60" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#6B6858" letter-spacing="2">INDIA</text>
</svg>
