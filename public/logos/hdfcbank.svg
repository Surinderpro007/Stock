<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="16" fill="#FFFFFF"/>
  <!-- HDFC Interlocking Squares Emblem -->
  <g transform="translate(36, 16)">
    <!-- 4 Blue Corner Blocks -->
    <rect x="0" y="0" width="20" height="20" fill="#004C8F"/>
    <rect x="28" y="0" width="20" height="20" fill="#004C8F"/>
    <rect x="0" y="28" width="20" height="20" fill="#004C8F"/>
    <rect x="28" y="28" width="20" height="20" fill="#004C8F"/>
    <!-- Red Central Bar cross -->
    <rect x="18" y="6" width="12" height="36" fill="#ED1C24"/>
    <rect x="6" y="18" width="36" height="12" fill="#ED1C24"/>
    <!-- Center white square -->
    <rect x="18" y="18" width="12" height="12" fill="#FFFFFF"/>
  </g>
  <!-- HDFC BANK text in blue background pill -->
  <rect x="12" y="78" width="96" height="26" rx="4" fill="#004C8F"/>
  <text x="60" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">HDFC BANK</text>
</svg>
