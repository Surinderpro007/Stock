  <g transform="translate(20, 16)">
    <!-- Outer Shield -->
    <polygon points="40,6 74,68 6,68" fill="#1D3A6C" stroke="#D4AF37" stroke-width="2.5"/>
    <polygon points="40,12 68,64 12,64" fill="#0D274D"/>
    <!-- ITC Letters -->
