  </g>
  <text x="60" y="103" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#1D3A6C" letter-spacing="1.2">ITC LIMITED</text>
</svg>
